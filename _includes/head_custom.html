<link rel="stylesheet" href="{{ '/assets/css/rtl.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
{% if page.translation_key %}
  {% assign versions = site.posts | where: "translation_key", page.translation_key %}
  {% for version in versions %}
    <link rel="alternate" hreflang="{{ version.lang }}" href="{{ version.url | absolute_url }}">
  {% endfor %}
{% endif %}
