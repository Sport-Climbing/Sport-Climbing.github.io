{% assign t = site.data.ui[page.lang] | default: site.data.ui.en %}
<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}" dir="ltr">
{% include head.html %}
<body class="layout-{{ page.layout }} lang-{{ page.lang | default: 'en' }}{% if page.overlay_header %} has-overlay-header{% endif %}">
  <a class="skip-link" href="#main">{{ t.skip }}</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  {% include lightbox.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
