# Site settings
title: "صعودهای ورزشی"
email: sportclimbing@kavehrs.com

description: >-
  مرجع تخصصی صعودهای ورزشی؛ آموزش، دانش علمی، پژوهش،
  تکنیک‌ها، تجهیزات، قوانین و اطلاعات معتبر درباره بولدر، لید و سرعت.

lang: fa

baseurl: ""
url: "https://sportclimbing.ir"

# Theme
remote_theme: just-the-docs/just-the-docs

# Build settings
plugins:
  - jekyll-remote-theme
  - jekyll-feed

# Just the Docs settings
search_enabled: true
heading_anchors: true

# Pages collection
collections:
  pages:
    output: true
    permalink: /:name/

just_the_docs:
  collections:
    pages:
      name: صفحات
      nav_exclude: false
      nav_fold: false

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/


footer_content: "© 2026  
صعودهای ورزشی & KavehRS.com"



url: "https://sportclimbing.ir"

plugins:
  - jekyll-sitemap



